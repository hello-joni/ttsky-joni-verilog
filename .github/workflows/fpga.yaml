name: fpga

on:
  push:
    # Comment out (or remove) the following line to run the FPGA workflow on every push:
    # branches: none
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: checkout tt-support-tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          path: tt

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: install tt-support-tools dependencies
        run: pip install -r tt/requirements.txt

      - name: install oss-cad-suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          python-override: true

      - name: harden root project
        run: python tt/tt_fpga.py harden

      - name: upload bitstream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpga_bitstream
          path: |
            build/*
            src/*
            info.yaml
            LICENSE
